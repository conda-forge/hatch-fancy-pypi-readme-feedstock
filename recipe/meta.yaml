{% set name = "hatch-fancy-pypi-readme" %}
{% set version = "25.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/hatch_fancy_pypi_readme-{{ version }}.tar.gz
  sha256: 9c58ed3dff90d51f43414ce37009ad1d5b0f08ffc9fc216998a06380f01c0045

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0
  entry_points:
    - hatch-fancy-pypi-readme=hatch_fancy_pypi_readme.__main__:main

requirements:
  host:
    - hatchling
    - pip
    - python {{ python_min }}
  run:
    - hatchling
    - python >={{ python_min }}
    - tomli

test:
  source_files:
    - AUTHORS.md
    - CHANGELOG.md
    - LICENSE.txt
    - pyproject.toml
    - README.md
    - src
    - tests
  imports:
    - hatch_fancy_pypi_readme
  commands:
    - pip check
    - hatch-fancy-pypi-readme --help
    - pytest -vvv --capture=tee-sys tests
  requires:
    - python-build
    - pip
    - pytest
    - python {{ python_min }}

about:
  home: https://github.com/hynek/hatch-fancy-pypi-readme
  summary: Fancy PyPI READMEs with Hatch
  license: MIT
  license_file:
    - LICENSE.txt

extra:
  recipe-maintainers:
    - thewchan
